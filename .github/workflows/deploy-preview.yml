name: ANVERA preview deployment

on:
  push:
    branches:
      - feat/bmw-carbon-design-system
      - feature/wheel-size-fitment
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anvera-preview-deploy
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: anvera-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Inspect Astro Worker output and adapter resolution
        run: |
          echo "=== Astro server output ==="
          echo "=== Complete Astro dist tree ==="
          find dist -maxdepth 4 -type f -print | sort | head -240
          echo "=== Dist root ==="
          ls -la dist
          echo "=== Server root ==="
          ls -la dist/server
          echo "=== Generated Wrangler config ==="
          cat dist/server/wrangler.json
          echo "=== Generated server entry exports ==="
          tail -c 1200 dist/server/entry.mjs
          echo "=== Adapter package path ==="
          node -e "const fs=require('node:fs'); const p=require.resolve('@astrojs/cloudflare/entrypoints/server'); console.log('entrypoint:',p); console.log('exists:',fs.existsSync(p)); console.log('realpath:',fs.realpathSync(p)); console.log('package:',require.resolve('@astrojs/cloudflare/package.json'));"
          echo "=== pnpm linker ==="
          pnpm config get node-linker

      - name: Create isolated preview deployment config
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const generated = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
          const preview = JSON.parse(fs.readFileSync("wrangler.preview.jsonc", "utf8"));
          for (const key of ["name", "compatibility_date", "compatibility_flags", "d1_databases", "r2_buckets", "kv_namespaces", "images", "ratelimits", "vars", "triggers"]) {
            if (preview[key] !== undefined) generated[key] = preview[key];
          }
          generated.assets = { ...generated.assets, binding: "ASSETS", directory: "../client" };
          fs.writeFileSync("dist/server/wrangler.preview.json", JSON.stringify(generated, null, 2));
          NODE

      - name: Validate Wrangler bundle without deploying
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy isolated preview Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply EmDash migrations to isolated Preview D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          const config = "wrangler.preview.jsonc";
          const expectedDatabaseId = "9bebf5e9-b020-420f-b398-f2f177c52ede";
          const run = (args, capture = false) => {
            const result = spawnSync("pnpm", ["exec", "emdash", "migrate", ...args], {
              encoding: "utf8",
              env: process.env,
              stdio: capture ? ["ignore", "pipe", "inherit"] : "inherit"
            });
            return result;
          };
          const check = () => {
            const result = run(["--check", "--json", "--wrangler-config", config], true);
            const jsonLine = result.stdout.split(/\r?\n/).filter(line => line.trim().startsWith("{")).at(-1);
            if (!jsonLine) throw new Error("EmDash migration check did not return a JSON report.");
            const report = JSON.parse(jsonLine);
            if (report.target?.kind !== "d1" || report.target?.resourceId !== expectedDatabaseId) {
              throw new Error("Migration target mismatch: refusing to modify any database other than isolated Preview D1.");
            }
            if ((report.unknownApplied ?? []).length) {
              throw new Error("Preview D1 contains unknown applied migrations; refusing automatic migration.");
            }
            return report;
          };
          let report = check();
          console.log(JSON.stringify({ target: report.target.label, pending: report.pending ?? [] }));
          if ((report.pending ?? []).length) {
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const lockResponse = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${expectedDatabaseId}/query`, {
              method: "POST",
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
              body: JSON.stringify({ sql: "SELECT is_locked FROM _emdash_migrations_lock WHERE id = ?", params: ["migration_lock"] })
            });
            const lockPayload = await lockResponse.json();
            if (!lockResponse.ok || !lockPayload.success) throw new Error("Unable to inspect isolated Preview D1 migration lock.");
            const lockedAt = Number(lockPayload.result?.[0]?.results?.[0]?.is_locked ?? 0);
            if (lockedAt > 0) {
              const lockAgeMs = Date.now() - lockedAt;
              if (lockAgeMs < 15 * 60 * 1000) throw new Error("Preview D1 migration lock is recent; refusing to interrupt a possibly active migration.");
              console.log(`Releasing stale Preview-only migration lock aged ${Math.round(lockAgeMs / 60000)} minutes.`);
              const released = run([`--release-lock=${lockedAt}`, `--expected-target-fingerprint=${report.target.fingerprint}`, "--wrangler-config", config]);
              if (released.status !== 0) process.exit(released.status ?? 1);
            }
            const applied = run([`--expected-target-fingerprint=${report.target.fingerprint}`, "--wrangler-config", config]);
            if (applied.status !== 0) process.exit(applied.status ?? 1);
            report = check();
          }
          if ((report.pending ?? []).length || (report.unknownApplied ?? []).length) {
            throw new Error("Preview D1 migrations are not in a clean state after migration.");
          }
          console.log("Isolated Preview D1 migration state verified.");
          NODE

      - name: Smoke test Wheel-Size catalog proxy
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://anvera-preview.xg-y.workers.dev/api/vehicle-catalog?resource=makes&region=sam");
          const text = await response.text();
          if (!response.ok) throw new Error(`Catalog smoke test failed (${response.status}): ${text.slice(0, 500)}`);
          const payload = JSON.parse(text);
          const rows = Array.isArray(payload) ? payload : (payload.data ?? payload.results ?? payload.makes);
          if (!Array.isArray(rows) || rows.length === 0) {
            throw new Error(`Catalog response has no make records: ${JSON.stringify(payload).slice(0, 500)}`);
          }
          console.log(JSON.stringify({ status: response.status, count: rows.length, firstRecordKeys: Object.keys(rows[0] ?? {}) }));
          NODE
