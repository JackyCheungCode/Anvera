name: ANVERA preview deployment

on:
  push:
    branches:
      - feat/bmw-carbon-design-system
      - feature/wheel-size-fitment
      - fix/vehicle-fitment-worker-dispatch
      - feat/vehicle-fitment-oem-aftermarket-products
      - fix/vehicle-fitment-carbon-ui
      - feat/vehicle-picker-brand-and-model-imagery
      - feat/wheels-catalog-and-product-data
      - feat/product-intelligence-global-setup
      - feat/product-intelligence-material-process-library
      - feat/customer-configuration-studio
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anvera-preview-deploy
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: anvera-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Inspect Astro Worker output and adapter resolution
        run: |
          echo "=== Astro server output ==="
          echo "=== Complete Astro dist tree ==="
          find dist -maxdepth 4 -type f -print | sort | head -240
          echo "=== Dist root ==="
          ls -la dist
          echo "=== Server root ==="
          ls -la dist/server
          echo "=== Generated Wrangler config ==="
          cat dist/server/wrangler.json
          echo "=== Generated server entry exports ==="
          tail -c 1200 dist/server/entry.mjs
          echo "=== Adapter package path ==="
          node -e "const fs=require('node:fs'); const p=require.resolve('@astrojs/cloudflare/entrypoints/server'); console.log('entrypoint:',p); console.log('exists:',fs.existsSync(p)); console.log('realpath:',fs.realpathSync(p)); console.log('package:',require.resolve('@astrojs/cloudflare/package.json'));"
          echo "=== pnpm linker ==="
          pnpm config get node-linker

      - name: Create isolated preview deployment config
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const generated = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
          const preview = JSON.parse(fs.readFileSync("wrangler.preview.jsonc", "utf8"));
          for (const key of ["name", "compatibility_date", "compatibility_flags", "d1_databases", "r2_buckets", "kv_namespaces", "images", "ratelimits", "vars", "triggers"]) {
            if (preview[key] !== undefined) generated[key] = preview[key];
          }
          generated.assets = { ...generated.assets, binding: "ASSETS", directory: "../client" };
          fs.writeFileSync("dist/server/wrangler.preview.json", JSON.stringify(generated, null, 2));
          NODE

      - name: Apply Product Intelligence schema to isolated preview D1
        run: pnpm exec wrangler d1 execute anvera-preview --remote --file migrations/0001_product_intelligence_global_setup.sql --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Material and Forging library schema to isolated preview D1
        run: pnpm exec wrangler d1 execute anvera-preview --remote --file migrations/0002_product_intelligence_material_process_library.sql --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Product Intelligence review schema to isolated preview D1
        run: pnpm exec wrangler d1 execute anvera-preview --remote --file migrations/0003_product_intelligence_library_reviews.sql --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Product Intelligence finish schema to isolated preview D1
        run: pnpm exec wrangler d1 execute anvera-preview --remote --file migrations/0004_product_intelligence_finish_library.sql --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply construction capability schema to isolated preview D1
        run: pnpm exec wrangler d1 execute anvera-preview --remote --file migrations/0005_product_intelligence_construction_capabilities.sql --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upgrade Product Intelligence review and mapping constraints in Preview D1
        run: pnpm exec wrangler d1 execute anvera-preview --remote --file migrations/0006_product_intelligence_review_mapping_constraint_upgrade.sql --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply normalized wheel specification schema to isolated preview D1
        run: pnpm exec wrangler d1 execute anvera-preview --remote --file migrations/0007_product_intelligence_wheel_specifications.sql --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply customer configuration order schema to isolated preview D1
        run: pnpm exec wrangler d1 execute anvera-preview --remote --file migrations/0008_customer_configuration_orders.sql --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate Wrangler bundle without deploying
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy isolated preview Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test Wheel-Size catalog proxy
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://anvera-preview.xg-y.workers.dev/vehicle-fitment/catalog?resource=makes&region=sam");
          const text = await response.text();
          if (!response.ok) throw new Error(`Catalog smoke test failed (${response.status}): ${text.slice(0, 500)}`);
          const payload = JSON.parse(text);
          const rows = Array.isArray(payload) ? payload : (payload.data ?? payload.results ?? payload.makes);
          if (!Array.isArray(rows) || rows.length === 0) {
            throw new Error(`Catalog response has no make records: ${JSON.stringify(payload).slice(0, 500)}`);
          }
          console.log(JSON.stringify({ status: response.status, count: rows.length, firstRecordKeys: Object.keys(rows[0] ?? {}) }));
          const searchProbe = await fetch("https://anvera-preview.xg-y.workers.dev/vehicle-fitment/search", {
            method: "POST",
            headers: { Origin: "https://anvera-preview.xg-y.workers.dev", "Content-Type": "application/json" },
            body: "{}"
          });
          if (searchProbe.status !== 422) throw new Error(`Search route smoke test failed (${searchProbe.status}): ${(await searchProbe.text()).slice(0, 300)}`);
          NODE
