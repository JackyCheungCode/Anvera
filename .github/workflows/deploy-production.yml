name: ANVERA production deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anvera-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Verify production D1 migration state (read-only)
        run: pnpm exec emdash migrate --check --wrangler-config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inspect generated vehicle API route registration
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = "dist/server";
          const hits = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith(".mjs")) {
                const source = fs.readFileSync(file, "utf8");
                for (const needle of ["/api/vehicle-catalog", "vehicle-catalog"]) {
                  const index = source.indexOf(needle);
                  if (index >= 0) hits.push({ file, needle, excerpt: source.slice(Math.max(0, index - 1200), index + 2400) });
                }
              }
            }
          };
          walk(root);
          const entry = fs.readFileSync("dist/server/entry.mjs", "utf8");
          console.log("Worker entry references:", entry.split("\\n").filter(line => line.includes("entrypoints") || line.includes("manifest")).slice(0, 30));
          console.log(JSON.stringify(hits.slice(0, 12), null, 2));
          if (!hits.some(hit => hit.needle === "vehicle-catalog")) throw new Error("Vehicle catalog route module was not emitted.");
          NODE


      - name: Validate production Worker bundle
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production Wheel-Size catalog proxy
        run: |
          node --input-type=module <<'NODE'
          const base = "https://anvera.xg-y.workers.dev";
          const page = await fetch(`${base}/vehicle-fitment`);
          const html = await page.text();
          if (!page.ok || !html.includes("brand-logo") || !html.includes("vehicle-fitment")) {
            throw new Error(`Vehicle fitment page check failed (${page.status}).`);
          }
          const candidates = [
            "/api/vehicle-catalog?resource=makes&region=sam",
            "/api/vehicle-catalog/?resource=makes&region=sam",
            "/api/vehicle-catalog.json?resource=makes&region=sam"
          ];
          let response;
          let text = "";
          for (const path of candidates) {
            const candidate = await fetch(`${base}${path}`);
            const candidateText = await candidate.text();
            console.log(`Route probe ${path}: HTTP ${candidate.status} (${candidate.headers.get("content-type")})`);
            if (candidate.ok) { response = candidate; text = candidateText; break; }
          }
          if (!response) throw new Error("No tested vehicle-catalog route returned a successful response.");
          const payload = JSON.parse(text);
          const rows = Array.isArray(payload) ? payload : (payload.data ?? payload.results ?? payload.makes);
          if (!Array.isArray(rows) || rows.length === 0) {
            throw new Error(`Wheel-Size returned no make records: ${JSON.stringify(payload).slice(0, 500)}`);
          }
          console.log(JSON.stringify({ pageStatus: page.status, catalogStatus: response.status, makeCount: rows.length, firstRecordKeys: Object.keys(rows[0] ?? {}) }));
          NODE

      - name: Verify production homepage
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 https://anvera.xg-y.workers.dev/)
          echo "Homepage HTTP status: $status"
          test "$status" = "200"
          admin_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 https://anvera.xg-y.workers.dev/_emdash/admin/)
          echo "EmDash admin HTTP status: $admin_status"
