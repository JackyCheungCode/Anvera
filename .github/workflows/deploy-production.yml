name: ANVERA production deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anvera-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Verify production D1 migration state (read-only)
        run: pnpm exec emdash migrate --check --wrangler-config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inspect custom Worker vehicle route handlers
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const hits = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith(".mjs")) {
                const source = fs.readFileSync(file, "utf8");
                for (const needle of ["/vehicle-fitment/catalog", "/vehicle-fitment/search"]) {
                  if (source.includes(needle)) hits.push({ file, needle });
                }
              }
            }
          };
          walk("dist/server");
          console.log(JSON.stringify(hits, null, 2));
          for (const route of ["/vehicle-fitment/catalog", "/vehicle-fitment/search"]) {
            if (!hits.some(hit => hit.needle === route)) throw new Error(`Worker route handler missing from bundle: ${route}`);
          }
          NODE

      - name: Validate production Worker bundle
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production Wheel-Size catalog proxy
        run: |
          node --input-type=module <<'NODE'
          const base = "https://anvera.xg-y.workers.dev";
          const page = await fetch(`${base}/vehicle-fitment`);
          const html = await page.text();
          if (!page.ok || !html.includes("brand-logo") || !html.includes("vehicle-fitment")) {
            throw new Error(`Vehicle fitment page check failed (${page.status}).`);
          }
          const candidates = [
            "/vehicle-fitment/catalog?resource=makes&region=sam",
            "/vehicle-fitment/catalog/?resource=makes&region=sam",
            "/vehicle-fitment/catalog.json?resource=makes&region=sam"
          ];
          let response;
          let text = "";
          for (const path of candidates) {
            const candidate = await fetch(`${base}${path}`);
            const candidateText = await candidate.text();
            console.log(`Route probe ${path}: HTTP ${candidate.status} (${candidate.headers.get("content-type")})`);
            if (candidate.ok) { response = candidate; text = candidateText; break; }
          }
          if (!response) throw new Error("No tested vehicle-catalog route returned a successful response.");
          const payload = JSON.parse(text);
          const rows = Array.isArray(payload) ? payload : (payload.data ?? payload.results ?? payload.makes);
          if (!Array.isArray(rows) || rows.length === 0) {
            throw new Error(`Wheel-Size returned no make records: ${JSON.stringify(payload).slice(0, 500)}`);
          }
          console.log(JSON.stringify({ pageStatus: page.status, catalogStatus: response.status, makeCount: rows.length, firstRecordKeys: Object.keys(rows[0] ?? {}) }));
          const searchProbe = await fetch(`${base}/vehicle-fitment/search`, {
            method: "POST",
            headers: { Origin: base, "Content-Type": "application/json" },
            body: "{}"
          });
          if (searchProbe.status !== 422) throw new Error(`Vehicle search route check failed (${searchProbe.status}): ${(await searchProbe.text()).slice(0, 300)}`);
          NODE

      - name: Verify production homepage
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 https://anvera.xg-y.workers.dev/)
          echo "Homepage HTTP status: $status"
          test "$status" = "200"
          admin_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 https://anvera.xg-y.workers.dev/_emdash/admin/)
          echo "EmDash admin HTTP status: $admin_status"
