name: Anvera production deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: anvera-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Anvera
        run: pnpm build

      - name: Apply approved EmDash migrations and take over stale lock
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec emdash migrate
          --take-over-lock=1794444823197
          --expected-target-fingerprint=dd5149caa29eb4ee22c463b7e94edfc8273097727caa13702b51a628c9a82c40
          --json
          --wrangler-config wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.jsonc

      - name: Verify production endpoint
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl -sS -o /tmp/anvera-response.txt -w "%{http_code}" https://anvera.xg-y.workers.dev/ || true)
            echo "Attempt ${attempt}: HTTP ${status}"
            if [ "${status}" = "200" ]; then
              head -c 300 /tmp/anvera-response.txt
              exit 0
            fi
            sleep 5
          done
          echo "Production endpoint did not return HTTP 200."
          exit 1
